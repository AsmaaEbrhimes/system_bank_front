<section>
  <!-- Number -->
  <div class="fild_number_usre">
    <div class="wrapper_code_country">
      <input [value]="value" #phoneInput [placeholder]="select_item()?.placeholder || '100 123 4567'" (input)="onPhoneInput($event)" [attr.maxlength]="select_item()?.maxLength"/>
      <div class="code_country" (click)="toggleDropdown()">
        <span><svg-icon src="/Icons/fa7-solid--angle-down.svg" class="input-icon"></svg-icon></span>
        <span>{{select_item()?.dialCode}}</span>
        <span><svg-icon [src]="'/Flags/' + select_item()?.icon + '.svg'" class="input-icon" class="input-icon"></svg-icon></span>
      </div>
    </div>
  </div>

  <!-- content_country -->
  <div class="content_country" [class.active]="isOpen()" (click)="$event.stopPropagation()">
    <div class="search">
      <input placeholder="Search Country Or Code" />
      <svg-icon [svgStyle]="{ 'width.px': 16, 'height.px': 16 }" src="/Icons/material-symbols--search.svg"
        class="search-icon"></svg-icon>
    </div>

    @for (item of COUNTRIES; track $index) {
    <button class="country" (click)="onChooesCountry(item , $event , phoneInput)">
      <div class="code_country">
        <span>{{item?.dialCode}}</span>
      </div>

      <div class="flag_country">
        <span>{{item?.name}}</span>
        <span><svg-icon [src]="'/Flags/' + item?.icon + '.svg'" class="input-icon"></svg-icon></span>
      </div>
    </button>
    }
  </div>
</section>
