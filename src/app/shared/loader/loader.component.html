@if (Core._loading | async) {
<div class="sys-overlay" role="status" aria-live="polite">
  <div class="sys-loader">
    <div class="sys-loader__stage">
      <div class="sys-loader__glow"></div>
      <svg viewBox="0 0 120 140" aria-hidden="true">
        <defs>
          <clipPath id="shieldClip">
            <path d="M60 8 L108 26 V66 C108 98 88 120 60 132 C32 120 12 98 12 66 V26 Z" />
          </clipPath>
          <linearGradient id="shineGrad" x1="0" x2="1">
            <stop offset="0" stop-color="#fff" stop-opacity="0" />
            <stop offset=".5" stop-color="#fff" stop-opacity=".8" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
          </linearGradient>
        </defs>

        <path class="shield-fill" d="M60 8 L108 26 V66 C108 98 88 120 60 132 C32 120 12 98 12 66 V26 Z" />

        <path class="part roof" d="M60 40 L88 55 H32 Z" />
        <rect class="part col" x="38" y="60" width="8" height="28" rx="1.5" />
        <rect class="part col" x="51" y="60" width="8" height="28" rx="1.5" />
        <rect class="part col" x="64" y="60" width="8" height="28" rx="1.5" />
        <rect class="part col" x="77" y="60" width="8" height="28" rx="1.5" />
        <rect class="part base1" x="32" y="92" width="56" height="5" rx="1.5" />
        <rect class="part base2" x="27" y="100" width="66" height="5" rx="1.5" />

        <g clip-path="url(#shieldClip)">
          <rect class="shine" x="0" y="0" width="40" height="140" fill="url(#shineGrad)" transform="skewX(-18)" />
        </g>

        <path class="shield-line" d="M60 8 L108 26 V66 C108 98 88 120 60 132 C32 120 12 98 12 66 V26 Z" />
      </svg>
    </div>

    <div class="sys-loader__label">
      Loading data<span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>
    <div class="sys-loader__sub">Just a moment, and we'll show you everything</div>
    <div class="sys-loader__bar"><i></i></div>
  </div>
</div>

}
