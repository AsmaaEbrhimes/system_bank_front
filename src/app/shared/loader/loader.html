@if (Core._loading | async) {
<div class="content_loader">
  <div class="bg-blob b1"></div>
  <div class="bg-blob b2"></div>

  <div class="loader-card">
    <div class="ring-wrap">

      <svg class="spinner-outer" viewBox="0 0 176 176" xmlns="http://www.w3.org/2000/svg">
        <circle cx="88" cy="88" r="82" fill="none"
          stroke="rgba(200,165,80,0.18)"
          stroke-width="1.5"
          stroke-dasharray="6 10"
          stroke-linecap="round"/>
      </svg>

      <svg class="spinner" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="arcG" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="#3a8c4a"/>
            <stop offset="60%"  stop-color="#7bc47f"/>
            <stop offset="100%" stop-color="#c8a550"/>
          </linearGradient>
        </defs>
        <circle cx="80" cy="80" r="72" fill="none"
          stroke="rgba(58,140,74,0.08)" stroke-width="2"/>
        <circle cx="80" cy="80" r="72" fill="none"
          stroke="url(#arcG)"
          stroke-width="4"
          stroke-dasharray="100 452"
          stroke-linecap="round"
          transform="rotate(-90 80 80)"/>
      </svg>

      <div class="logo-inner">
        <div class="logo-box">
          <img src="assets/Img/logo 8.png" />
        </div>
      </div>
    </div>

    <div id="lt">LOADING</div>

    <div class="dots-row">
      <div class="dot d1"></div>
      <div class="dot d2"></div>
      <div class="dot d3"></div>
    </div>

    <div class="prog-section">
      <div class="prog-wrap">
        <div class="prog-fill"></div>
      </div>
      <div class="prog-label">جاري التحميل...</div>
    </div>
  </div>
</div>
}
