<section class="content_menue">
  <div class="logo_badge">
    <div>
      <h4>The closet</h4>
      <p>Banking Operations Dashboard</p>
    </div>

    <svg viewBox="0 0 100 100" class="shield_icon" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#8b5cf6" />
          <stop offset="100%" stop-color="#5b21b6" />
        </linearGradient>
      </defs>

      <!-- جسم الدرع -->
      <path d="M50 4
             L86 18
             V46
             C86 70 70 89 50 97
             C30 89 14 70 14 46
             V18
             Z" fill="url(#shieldGradient)" />

      <!-- الطبقة البيضاء الداخلية -->
      <path d="M50 12
             L78 23
             V46
             C78 65 66 80 50 87
             C34 80 22 65 22 46
             V23
             Z" fill="#ffffff" />

      <!-- أيقونة البنك -->
      <g fill="url(#shieldGradient)">
        <!-- القبة (نص دائرة) -->
        <path d="M35 40 A15 15 0 0 1 65 40 Z" />
        <!-- خط رفيع تحت القبة -->
        <rect x="33" y="40" width="34" height="3" rx="1" />
        <!-- الأعمدة -->
        <rect x="36" y="46" width="4" height="20" />
        <rect x="45" y="46" width="4" height="20" />
        <rect x="51" y="46" width="4" height="20" />
        <rect x="60" y="46" width="4" height="20" />
        <!-- القاعدة -->
        <rect x="32" y="68" width="36" height="4" rx="1" />
      </g>
    </svg>
  </div>


  <ul>
    @for(item of List_Menue ; track $index){
    <li [ngClass]="{'active':$index == 0}">
      <span>{{item.name}}</span>
      <span class="icon-wrapper"><svg-icon [svgStyle]="{ 'width.px': 20, 'height.px': 20 }"
          [src]="'/Icons/' + item.icon"></svg-icon></span>
    </li>
    }
  </ul>

  <button class="btn_logout"><svg-icon [svgStyle]="{ 'width.px': 18, 'height.px': 18 }"
      src="/Icons/material-symbols-light--logout.svg"></svg-icon>


    <span> Logout</span>
  </button>
</section>
