<section>
  <!-- Header Transactions -->
  <div class="header_transactions">
    <div>
      <h3>Transactions</h3>
      <p>The Complete Ledger — Deposit, Withdrawal, Transfer</p>
    </div>

    <div class="container_svg">
      <svg-icon [svgStyle]="{ 'width.px': 18, 'height.px': 18 }" src="/Icons/hugeicons--transaction.svg"></svg-icon>
    </div>

  </div>


  <div class="tabel_transactions">
    <!-- Action Buttons -->
    <div class="action_buttons">
      <button class="btn_deposit" (click)="onShowDilogTransactions('Deposit')">Deposit <svg-icon
          src="/Icons/akar-icons--arrow-down-right.svg"></svg-icon></button>
      <button class="btn_Withdraw" (click)="onShowDilogTransactions('Withdraw')">Withdraw <svg-icon
          src="/Icons/akar-icons--arrow-up-right.svg"></svg-icon></button>
      <button class="btn_transfare" (click)="onShowDilogTransactions('Transfer')">Transfer <svg-icon
          src="/Icons/grommet-icons--transaction.svg"></svg-icon></button>
    </div>


    <!-- Tabels -->
    <app-search [ArrayColumns]="['transactionType']" (DataFilter)="data.set($event)"></app-search>
    <app-tabel [data]="data()" [bodytabel]="bodyTabel()" [templates]="{ transactionType: type }">

      <ng-template #type let-row>

        <span class="status-badge" [attr.data-type]="row.transactionType">
          {{ row.transactionType }}
        </span>

      </ng-template>
    </app-tabel>
  </div>
</section>
