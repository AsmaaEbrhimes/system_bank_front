<div class="clean-dialog-wrapper">

  <div class="clean-header">
    <button (click)="onCloseDilog()" type="button" class="x-close-btn">&times;</button>

    <div class="header-left">

      <div>
        <h2>Withdraw</h2>
        <p>Take money out of an account</p>
      </div>


      <div class="icon-box withdraw">
        <svg-icon src="/Icons/akar-icons--arrow-up-right.svg" class="input-icon"></svg-icon>
      </div>

    </div>
  </div>

  <div class="clean-body">

    <form>

      <!-- Account ID -->
      <div class="Group">
        <label>Account ID</label>
        <div class="input-container">
          <span class="prefix-symbol">#</span>
          <input type="text" placeholder="Enter account ID" />
        </div>
      </div>

      <!-- Amount -->
      <div class="Group">
        <label>Amount</label>
        <div class="input-container">
          <span class="prefix-symbol">
            <svg-icon src="/Icons/fluent--wallet-16-regular.svg" class="input-icon"></svg-icon>

          </span>
          <input type="number" placeholder="500" />
        </div>
        <small class="helper-text">Must be less than the account balance</small>
      </div>






      <div class="dialog-actions">
        <button type="button" class="btn-cancel" (click)="onCloseDilog()">Cancel</button>
        <button type="submit" class="btn-action withdraw">Withdraw</button>
      </div>

    </form>
  </div>
</div>
