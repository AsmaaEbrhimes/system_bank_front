<section>
  <div class="header_notifications">
    <div>
      <h3>Instant notifications</h3>
      <p>Live broadcast of any activity on clients' accounts</p>
    </div>

    <div class="container_svg">
      <svg-icon [svgStyle]="{ 'width.px': 18, 'height.px': 18 }"
        src="/Icons/material-symbols--notifications-outline-rounded.svg"></svg-icon>
    </div>
  </div>

@if(notifications()?.length > 0){
  <div class="content_notifications">
    @for(notificate of notifications() ; track notificate?.id){
    <div class="card">
      <span>{{notificate?.createdAt | date}}</span>
      <div>
        <h4>{{notificate?.title}}</h4>
        <p>{{notificate?.message}}</p>
      </div>
    </div>
    }
  </div>
}@else {<app-no-data></app-no-data>}

</section>
