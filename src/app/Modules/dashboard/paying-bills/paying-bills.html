<section class="wrapper_paying_bills">
  <div class="wrapper_header_paying">
    <button class="btn_download_report" (click)="onOpenComponentCreateInvoice()">
      <span>Create Invoice</span>
      <svg-icon [svgStyle]="{ 'width.px': 18, 'height.px': 18 }" src="/Icons/mdi--receipt-text-plus.svg"></svg-icon>
    </button>



    <div class="header_paying_bills">
      <div>
        <h3>Paying bills</h3>
        <p>Due service bills and the record of immediate payment from the customer's balance</p>
      </div>

      <div class="header_logo">
        <svg-icon [svgStyle]="{ 'width.px': 25, 'height.px': 25 }" src="/Icons/hugeicons--payment-02.svg"></svg-icon>
      </div>
    </div>

  </div>


  <app-billing-metrics (selectedCustomerId)="onSelectCustomer($event)"></app-billing-metrics>



  <div class="Tabel">

    <div class="tabs_button">
      <div class="thumb" [class.pos-2]="activeTab === 'paid'"></div>

      <button [class.active]="activeTab === 'unpaid'" (click)="onActiveTap('unpaid')">
        <span class="icon"> <svg-icon [svgStyle]="{ 'width.px': 18, 'height.px': 18 }"
            src="/Icons/uil--receipt.svg"></svg-icon></span>
        <span>Unpaid</span>
        <span class="count" [class.active_count]="activeTab === 'unpaid'">{{data().length}}</span>
      </button>

      <button [class.active]="activeTab === 'paid'" (click)="onActiveTap('paid')">
        <span class="icon"> <svg-icon [svgStyle]="{ 'width.px': 18, 'height.px': 18 }"
            src="/Icons/ep--circle-check-filled.svg"></svg-icon></span>
        <span>Paid</span>
        <span class="count" [class.active_count]="activeTab === 'paid'">{{data().length}}</span>
      </button>
    </div>

    <div class="wrapper_search">
      <app-search></app-search>
    </div>

    <app-tabel [data]="data()" [bodytabel]="boadyTabel()">

      <ng-template #status let-row>
        <span class="status-badge" [class.success]="row.isPaid" [class.pending]="!row.isPaid">
          <i class="dot"></i>
          <span>{{ row.isPaid ? 'Paid' : 'Unpaid' }}</span>
        </span>
      </ng-template>
    </app-tabel>
  </div>
</section>
