<section>
  <div class="header_loans">
    <div class="content_header">
      <div class="wrapper_header">
        <h3>Loans</h3>
        <div class="flex_header">
          <button (click)="OpenDilog()">Applying for a loan +</button>

          <p>
            <span class="title">Submitting the application</span><span class="arrow">←</span>
            <span class="title">Review</span><span class="arrow">←</span>
            <span class="title">Identifying the benefit Review</span><span class="arrow">←</span>
            <span class="title">Approval or rejection</span>
          </p>

        </div>

      </div>
      <div class="container_svg">
        <svg-icon [svgStyle]="{ 'width.px': 18, 'height.px': 18 }" src="/Icons/griddy-icons--loan.svg"></svg-icon>
      </div>
    </div>
  </div>




  <div class="wrapper_Statistics">
    <div class="card warning">
      <div class="card-content">
        <h3>4</h3>
        <p>Under review</p>
      </div>
      <div class="icon">
        <svg-icon [svgStyle]="{ 'width.px': 22, 'height.px': 22 }" src="/Icons/mdi-light--clock.svg"></svg-icon>
      </div>
    </div>

    <div class="card success">
      <div class="card-content">
        <h3>128</h3>
        <p>Approved this month</p>
      </div>
      <div class="icon">
        <svg-icon [svgStyle]="{ 'width.px': 22, 'height.px': 22 }" src="/Icons/mdi--success.svg"></svg-icon>
      </div>
    </div>

    <div class="card danger">
      <div class="card-content">
        <h3>14</h3>
        <p>Rejected this month</p>
      </div>
      <div class="icon">
        <svg-icon [svgStyle]="{ 'width.px': 22, 'height.px': 22 }"
          src="/Icons/material-symbols--close-rounded.svg"></svg-icon>
      </div>
    </div>
  </div>


  <div class="tabel_loans">
    <div class="buttons_tap">
      <button (click)="GetLoansWithStstus('All')" [class.active]="active_tap()==0" (click)="SetActive(0)">All</button>
      <button (click)="GetLoansWithStstus('Pending')" [class.active]="active_tap()==1" (click)="SetActive(1)">Under
        review</button>
      <button (click)="GetLoansWithStstus('Approved')" [class.active]="active_tap()==2" (click)="SetActive(2)"
        class="active">Approved</button>
      <button (click)="GetLoansWithStstus('Rejected')" [class.active]="active_tap()==3"
        (click)="SetActive(3)">Rejected</button>
    </div>

    <app-search [ArrayColumns]="['applicationDate', 'status']" (DataFilter)="data.set($event)"></app-search>

    <app-tabel [data]="data()" [bodytabel]="boayTabel()">

      <ng-template #actions let-item>
        @if(item?.status == "Pending"){
          <div class="action_tabel">
            <button (click)="onAccept(item)" class="btn_accept" pTooltip="Accept" tooltipPosition="top">Accept <svg-icon [svgStyle]="{ 'width.px': 18, 'height.px': 18 }" src="/Icons/mdi--success.svg"></svg-icon></button>
            <button (click)="onReject(item)" class="btn_reject" pTooltip="Reject" tooltipPosition="top">Reject <svg-icon [svgStyle]="{ 'width.px': 18, 'height.px': 18 }" src="/Icons/material-symbols--close-rounded.svg"></svg-icon></button>
          </div>
        }
      </ng-template>

      <ng-template #status let-item>
        <span class="status-badge" [ngClass]="item?.status?.toLowerCase()">
          <span class="status-dot"></span>
          {{ item?.status }}
        </span>
      </ng-template>

    </app-tabel>
  </div>
</section>
