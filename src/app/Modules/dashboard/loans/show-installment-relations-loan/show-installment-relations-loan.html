<div class="wrapper_tabel">
  <app-search [ArrayColumns]="['name']" (DataFilter)="installments.set($event)"></app-search>

  <app-tabel [data]="installments()" [bodytabel]="boayTabel()" [templates]="{status: status , actions: actions}">

    <!-- Actions -->
    <ng-template #actions let-item>
      @if(item?.status == false){
        <button class="btn-pay">
      <svg-icon [svgStyle]="{ 'width.px': 16, 'height.px': 16 }" src="/Icons/hugeicons--payment-02.svg"></svg-icon>
      Pay Now
    </button>
      }
    </ng-template>




    <!-- status -->
    <ng-template #status let-item>
      @if (item.status) {
      <span class="badge badge-success">
        <span class="dot"></span>
        {{item.status??"Paid"}}
      </span>
      } @else {
      <span class="badge badge-danger">
        <span class="dot"></span>
        {{item.status ? "No Paid":"Paid"}}
      </span>
      }
    </ng-template>
  </app-tabel>
</div>
