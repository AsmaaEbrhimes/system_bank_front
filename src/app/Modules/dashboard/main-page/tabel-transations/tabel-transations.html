<section class="Tabel_transactions">
  <div class="header_transactions">

    <app-search [ArrayColumns]="['transactionType']" (DataFilter)="data.set($event)"></app-search>


    <a [routerLink]="['/ContentDashboard/transactions']" href=""><svg-icon
        [svgStyle]="{ 'width.px': 18, 'height.px': 18 }" src="/Icons/formkit--arrowright.svg"></svg-icon>The latest
      notebook moves</a>
  </div>

  <app-tabel [data]="data()" [bodytabel]="bodyTabel()" [templates]="{ transactionType: type }"
    (pageChange)="OnPagnaotor($event)">

    <ng-template #type let-row>

      <span class="status-badge" [attr.data-type]="row.transactionType">
        {{ row.transactionType }}
      </span>

    </ng-template>
  </app-tabel>
</section>
