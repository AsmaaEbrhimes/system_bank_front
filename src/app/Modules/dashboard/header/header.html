<section class="header_wrapper">
  <div class="wrapper_content_header">

    <div class="account_and_notification_user">
      <div class="account_user">
        <svg-icon [svgStyle]="{ 'width.px': 22, 'height.px': 22 }" src="/Icons/vadivam--user-round.svg"></svg-icon>
      </div>




      <div class="notification_wrapper">
        <button class="notification_btn" aria-label="Notifications">
          <svg-icon [svgStyle]="{ 'width.px': 22, 'height.px': 22 }"
            src="/Icons/material-symbols--notifications-outline-rounded.svg"></svg-icon>
          <span class="notification_badge">3</span>
        </button>
      </div>
    </div>






    <div class="view_user">
      <button class="toggel_menue" (click)="onToggelMenue()">
        <svg-icon [svgStyle]="{ 'width.px': 30, 'height.px': 30 }" src="/Icons/solar--list-outline.svg"></svg-icon>
      </button>
    </div>
  </div>


</section>
