<section>
  <div class="header_custmer">
    <button>Add Clients +</button>

    <div class="content_header">

      <div>
        <h3>Clients</h3>
        <p>Managing customer data and linking it to bank accounts</p>
      </div>
      <div class="container_svg">
        <svg-icon [svgStyle]="{ 'width.px': 18, 'height.px': 18 }"
          src="/Icons/streamline--information-desk-customer-remix.svg"></svg-icon>
      </div>
    </div>


  </div>


  <div class="tabel_custmer">
    <app-search></app-search>
    <app-tabel [data]="data()" [bodytabel]="bodyTabel()">
      <ng-template #actions let-item>
        <div class="account-badge-container">
          @if (item.accounts?.length > 0) {
          <button class="badge-accounts has-accounts" (click)="getAccounts(item.accounts)">
            <svg-icon [svgStyle]="{ 'width.px': 15, 'height.px': 15 }" src="/Icons/akar-icons--link-chain.svg">
            </svg-icon>
            <span class="count-text">{{ item.accounts.length }} Accounts</span>
          </button>
          } @else {
          <span class="badge-accounts no-accounts">
            <svg-icon [svgStyle]="{ 'width.px': 15, 'height.px': 15 }" src="/Icons/material-symbols--close-rounded.svg">
            </svg-icon>
            <span class="count-text">No Accounts</span>
          </span>
          }
        </div>
      </ng-template>
    </app-tabel>
  </div>



  <app-custmer-have-accounts #accountsSection [AccountsCustmer]="accounts()"></app-custmer-have-accounts>
</section>
