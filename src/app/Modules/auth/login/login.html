<div class="login-container">

  <div class="login-form-section">
    <div class="form-content">

      <div class="brand-logo">
        <div class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18" />
            <path d="M3 10h18" />
            <path d="M5 6l7-3 7 3" />
            <path d="M4 10v11" />
            <path d="M20 10v11" />
            <path d="M8 10v11" />
            <path d="M12 10v11" />
            <path d="M16 10v11" />
          </svg>
        </div>
        <h2>BankOps</h2>
      </div>

      <h1>
        <span class="welcome-text">Welcome back!</span>
        <span class="wave">👋</span>
      </h1>
      <p class="welcome-sub">Login to access your dashboard</p>

      <form class="auth-form">

        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrapper">
            <svg-icon src="/Icons/ic--outline-email.svg" class="input-icon"></svg-icon>

            <input type="email" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label>Password</label>
            <a href="#" class="forgot-link">Forgot Password?</a>
          </div>
          <div class="input-wrapper">
            <svg-icon src="/Icons/mdi--password-outline.svg" class="input-icon"></svg-icon>

            <input type="password" placeholder="••••••••" required>
            <button type="button" class="eye-toggle" aria-label="Toggle password visibility">
              <svg-icon [svgStyle]="{ 'width.px': 18, 'height.px': 18 }"
                src="/Icons/boxicons--eye-slash.svg"></svg-icon>
            </button>
          </div>
        </div>

        <div>
          <div class="remember-me">
            <input type="checkbox" id="remember">
            <label for="remember">Remember me</label>
          </div>

          <button type="submit" class="btn-primary">Login &rarr;</button>
        </div>

        <div class="form-footer-signup">
          <span>Don't have an account?</span>
          <a [routerLink]="['/Register']" class="signup-link">Sign up</a>
        </div>
      </form>

      <div class="form-copyright">
        &copy; 2026 BankOps. All rights reserved.
      </div>
    </div>
  </div>











  <app-auth-banner></app-auth-banner>

</div>
